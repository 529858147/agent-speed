name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check fixtures with the reference implementation
        run: python3 spec/tools/reference.py --check-fixtures
      - name: Lint installer
        run: shellcheck install.sh

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test core
        working-directory: macos
        run: swift test
      - name: Build app bundle
        run: macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSpeed-macOS
          path: dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test windows/tests/AgentSpeed.Core.Tests -c Release
      - name: Test presentation
        run: dotnet test windows/tests/AgentSpeed.Presentation.Tests -c Release
      - name: Publish
        shell: pwsh
        run: ./windows/scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSpeed-Windows
          path: dist/AgentSpeed-Windows-*.zip
          if-no-files-found: error
