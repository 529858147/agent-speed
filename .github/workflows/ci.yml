name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zstd
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - name: Check fixtures with the reference implementation
        run: python3 spec/tools/reference.py --check-fixtures
      - name: Validate vehicle art
        run: python3 spec/tools/vehicles.py
      - name: Lint installer
        run: shellcheck install.sh

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test core
        working-directory: macos
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E '✘ Test [^ ]+ (recorded|failed)|error:' "$RUNNER_TEMP/test.log" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Build app bundle
        run: macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-macOS
          path: dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test core
        shell: bash
        run: |
          set -o pipefail
          dotnet test windows/tests/AgentSpeed.Core.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/core.log" || {
            grep -E -A3 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/core.log" | paste -sd' ' - | sed 's/ -- /\n/g' | head -10 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }
      - name: Test presentation
        shell: bash
        run: |
          set -o pipefail
          dotnet test windows/tests/AgentSpeed.Presentation.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/presentation.log" || {
            grep -E -A3 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/presentation.log" | paste -sd' ' - | sed 's/ -- /\n/g' | head -10 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }
      - name: Publish
        shell: pwsh
        run: ./windows/scripts/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows
          path: dist/AgentSpeed-Windows-*.zip
          if-no-files-found: error
